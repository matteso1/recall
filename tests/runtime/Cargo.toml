[package]
name = "featherstorm-controller-tests"
version = "0.0.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
featherstorm-core = { path = "../../overlay/core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
dirs = "6"

[workspace]
