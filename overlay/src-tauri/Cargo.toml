[package]
name = "featherstorm"
version = "0.1.0"
description = "Featherstorm - smart build overlay for League of Legends"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "featherstorm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
featherstorm-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
