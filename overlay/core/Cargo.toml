[package]
name = "recall-core"
version = "0.1.0"
edition = "2021"
description = "Recall build brain: LCU + Live Client clients, Data Dragon, item/rune import, rules engine"

[features]
# Explicit offline-only data injection. The app never enables this feature.
evaluation = []

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"
required-features = ["evaluation"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
log = "0.4"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
